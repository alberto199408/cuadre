<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuadre tiene dirección nueva</title>
<meta http-equiv="refresh" content="4;url=https://cuadre-inventario.github.io/">
<link rel="canonical" href="https://cuadre-inventario.github.io/">
<meta name="robots" content="noindex">
<style>body{font:18px/1.5 system-ui,sans-serif;margin:0;padding:40px 20px;background:#0b2a6b;color:#fff;text-align:center}a{color:#9fc0ff;font-weight:700;word-break:break-all}</style>
</head><body>
<h1>Cuadre tiene dirección nueva</h1>
<p>Te llevo ahora mismo…</p>
<p><a href="https://cuadre-inventario.github.io/">https://cuadre-inventario.github.io/</a></p>
<script>
(function(){
var to='https://cuadre-inventario.github.io/',jobs=[];
try{if('serviceWorker' in navigator)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf('/cuadre/')>-1}).map(function(r){return r.unregister()}))}))}catch(e){}
try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('cuadre-')===0}).map(function(k){return caches.delete(k)}))}))}catch(e){}
Promise.all(jobs).catch(function(){}).then(function(){setTimeout(function(){location.replace(to)},300)});
})();
</script></body></html>
